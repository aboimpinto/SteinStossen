name: CD - Steinstossen

on:
  push:
    tags:
      - "SteinStossen-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: aboimpinto/steinstossen-website

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test importer, database access, and types
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  build-and-deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/SteinStossen-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image with embedded SQLite database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem
          ssh-keyscan -H "${{ vars.AWS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy exact image to AWS host
        shell: bash
        env:
          SSH_HOST: ${{ vars.AWS_HOST }}
          SSH_USER: ${{ vars.AWS_SSH_USER }}
          HOST_PORT: ${{ vars.HOST_PORT }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?AWS_HOST repository variable is required}"
          : "${SSH_USER:?AWS_SSH_USER repository variable is required}"
          : "${HOST_PORT:?HOST_PORT repository variable is required}"

          IMAGE_TAG="${{ steps.version.outputs.version }}"
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GHCR_USER="${{ github.actor }}"
          GHCR_TOKEN_B64="$(printf '%s' "${GHCR_TOKEN}" | base64 -w 0)"

          ssh -i ~/.ssh/aws.pem -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" \
            "IMAGE_TAG=${IMAGE_TAG}" \
            "GHCR_IMAGE=${GHCR_IMAGE}" \
            "GHCR_USER=${GHCR_USER}" \
            "GHCR_TOKEN_B64=${GHCR_TOKEN_B64}" \
            "HOST_PORT=${HOST_PORT}" \
            "APP_ROOT=${APP_ROOT}" \
            'bash -s' <<'DEPLOY_SCRIPT'
          set -euo pipefail

          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          : "${GHCR_IMAGE:?GHCR_IMAGE is required}"
          : "${HOST_PORT:?HOST_PORT is required}"

          APP_ROOT="${APP_ROOT:-/opt/steinstossen}"
          CONTAINER_NAME="SteinStossen_${IMAGE_TAG}"

          sudo mkdir -p "${APP_ROOT}"
          printf '%s' "${GHCR_TOKEN_B64}" | base64 -d | \
            sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          sudo docker pull "${GHCR_IMAGE}:${IMAGE_TAG}"

          CONTAINERS_ON_PORT="$(sudo docker ps --filter "publish=${HOST_PORT}" -q)"
          if [ -n "${CONTAINERS_ON_PORT}" ]; then
            for CONTAINER_ID in ${CONTAINERS_ON_PORT}; do
              EXISTING_NAME="$(sudo docker inspect --format '{{.Name}}' "${CONTAINER_ID}" | sed 's#^/##')"
              case "${EXISTING_NAME}" in
                SteinStossen_*) sudo docker rm -f "${CONTAINER_ID}" ;;
                *)
                  echo "Port ${HOST_PORT} belongs to ${EXISTING_NAME}; refusing to stop an unrelated container." >&2
                  exit 1
                  ;;
              esac
            done
          fi

          sudo docker ps -aq --filter 'name=SteinStossen_' | xargs -r sudo docker rm -f

          sudo docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart always \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e STEINSTOSSEN_DB_PATH=/app/data/steinstossen.sqlite \
            -p "127.0.0.1:${HOST_PORT}:3000" \
            "${GHCR_IMAGE}:${IMAGE_TAG}"

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/api/health" > /tmp/steinstossen-health.json; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              sudo docker logs "${CONTAINER_NAME}" --tail 150
              exit 1
            fi
            sleep 2
          done

          grep -q '"status":"ok"' /tmp/steinstossen-health.json
          curl -fsS "http://127.0.0.1:${HOST_PORT}/de" > /dev/null
          curl -fsS "http://127.0.0.1:${HOST_PORT}/en" > /dev/null
          printf '%s\n' "${IMAGE_TAG}" | sudo tee "${APP_ROOT}/current-release" > /dev/null
          sudo docker ps --filter "name=${CONTAINER_NAME}" \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          DEPLOY_SCRIPT

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/aws.pem

      - name: Deployment summary
        run: |
          {
            echo "### Steinstossen deployment complete"
            echo
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`"
            echo "- Container: \`SteinStossen_${{ steps.version.outputs.version }}\`"
            echo "- URL: \`https://${{ vars.APP_DOMAIN }}\`"
            echo "- Host bind: \`127.0.0.1:${{ vars.HOST_PORT }}\`"
            echo "- Database: embedded \`/app/data/steinstossen.sqlite\`"
          } >> "${GITHUB_STEP_SUMMARY}"
